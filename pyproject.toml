[project]
name = "ticket-tracker"
version = "0.0.1"
requires-python = ">=3.11.9"
dependencies = [
    "pandas>=3.0.3",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.16",
]
